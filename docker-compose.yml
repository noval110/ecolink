services:
  db:
    image: postgres:15-alpine
    container_name: ecolink_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ecolink123
      POSTGRES_DB: ecolink
    ports:
    - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: